databaseChangeLog:
  - changeSet:
      id: 001-create-notification-preferences
      author: developer
      changes:
        - createTable:
            tableName: notification_preferences
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_notification_preferences
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: channel
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: destination
                  type: VARCHAR(500)

        - addUniqueConstraint:
            tableName: notification_preferences
            columnNames: user_id, channel
            constraintName: uk_notification_preferences_user_channel

        - sql:
            sql: >
              ALTER TABLE notification_preferences
              ADD CONSTRAINT chk_notification_preferences_channel
              CHECK (channel IN ('EMAIL', 'TELEGRAM', 'PUSH'))